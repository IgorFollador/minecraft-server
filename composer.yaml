services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped

    stdin_open: true
    tty: true

    ports:
      - "127.0.0.1:25565:25565"

    env_file:
      - path: .env
        required: false

    environment:
      EULA: "${EULA:-TRUE}"
      TYPE: "${TYPE:-PAPER}"
      VERSION: "${VERSION:-26.3}"

      MEMORY: "${MEMORY:-4G}"
      MAX_PLAYERS: "${MAX_PLAYERS:-10}"

      MODE: "${MODE:-survival}"
      DIFFICULTY: "${DIFFICULTY:-normal}"

      ONLINE_MODE: "${ONLINE_MODE:-TRUE}"
      ENABLE_WHITELIST: "${ENABLE_WHITELIST:-TRUE}"
      SPAWN_PROTECTION: "${SPAWN_PROTECTION:-0}"

      VIEW_DISTANCE: "${VIEW_DISTANCE:-10}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-6}"

      SERVER_NAME: "${SERVER_NAME:-Filhos do Velho Barreiro}"
      MOTD: "${MOTD:-§6§lFilhos do Velho Barreiro§r\\n§8Survival Paper}"

      ICON: "${ICON:-/icon.png}"
      OVERRIDE_ICON: "${OVERRIDE_ICON:-TRUE}"

    volumes:
      - ./data:/data
      - ./plugins:/plugins:ro
      - ./icon.png:/icon.png:ro
