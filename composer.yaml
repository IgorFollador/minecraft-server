services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped

    stdin_open: true
    tty: true

    ports:
      - "127.0.0.1:25565:25565"

    dns:
      - 8.8.8.8
      - 1.1.1.1
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv6.conf.default.disable_ipv6: 1

    env_file:
      - path: .env
        required: false

    environment:
      EULA: "${EULA:-TRUE}"
      TYPE: "${TYPE:-FABRIC}"
      VERSION: "${VERSION:-26.3}"

      MEMORY: "${MEMORY:-4G}"
      MAX_PLAYERS: "${MAX_PLAYERS:-10}"

      MODE: "${MODE:-survival}"
      DIFFICULTY: "${DIFFICULTY:-normal}"

      ONLINE_MODE: "${ONLINE_MODE:-TRUE}"
      ENABLE_WHITELIST: "${ENABLE_WHITELIST:-TRUE}"
      SPAWN_PROTECTION: "${SPAWN_PROTECTION:-0}"

      VIEW_DISTANCE: "${VIEW_DISTANCE:-10}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-6}"

      SERVER_NAME: "${SERVER_NAME:-Filhos do Velho Barreiro}"
      MOTD: "${MOTD:-§6§lFilhos do Velho Barreiro§r\\n§8Survival Fabric}"

      ICON: "${ICON:-/icon.png}"
      OVERRIDE_ICON: "${OVERRIDE_ICON:-TRUE}"

      MODRINTH_PROJECTS: "${MODRINTH_PROJECTS:-fabric-api}"

    volumes:
      - ./data:/data
      - ./mods:/mods:ro
      - ./icon.png:/icon.png:ro

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: playit
    restart: unless-stopped
    network_mode: "service:minecraft"
    depends_on:
      - minecraft
    environment:
      SECRET_KEY_FILE: /run/secrets/playit
    volumes:
      - ./playit.secret:/run/secrets/playit:ro
