services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped

    stdin_open: true
    tty: true

    ports:
      - "127.0.0.1:25565:25565"

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.1.2"

      MEMORY: "4G"
      MAX_PLAYERS: "10"

      MODE: "survival"
      DIFFICULTY: "normal"

      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      SPAWN_PROTECTION: "0"

      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "6"

      SERVER_NAME: "Filhos do Velho Barreiro"
      MOTD: "§6§lFilhos do Velho Barreiro§r\\n§8Survival Paper"

      ICON: /icon.png
      OVERRIDE_ICON: "TRUE"

      PLUGINS: "https://github.com/playit-cloud/playit-minecraft-plugin/releases/download/v0.2.0/playit-minecraft-plugin.jar"

    volumes:
      - ./data:/data
      - ./icon.png:/icon.png:ro
